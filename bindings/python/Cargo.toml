[package]
name = "msrc-python"
description = "Python bindings for MSRC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
msrc = { path = "../.." }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
